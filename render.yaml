# Render Blueprint: deploys the Next.js app (web/Dockerfile) with real providers.
# Set GROQ_API_KEY in the Render dashboard (it is not stored in this file).
services:
  - type: web
    name: meetiq
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free            # use "starter" + the disk below to keep data across restarts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDINGS_PROVIDER
        value: local
      - key: GROQ_API_KEY
        sync: false
      # Render puts the app behind a proxy; trust its X-Forwarded-For for rate limiting.
      - key: TRUST_PROXY
        value: "1"
      # Shared "quick demo" sign-in (no password) gives every visitor admin of a shared
      # organisation. Off by default; set to "1" only for a throwaway showcase deploy.
      - key: DEMO_LOGIN
        value: "0"
    # disk:
    #   name: meetiq-data
    #   mountPath: /data
    #   sizeGB: 1
